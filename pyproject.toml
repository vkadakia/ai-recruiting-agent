[project]
name = "ai-recruiting-agent"
version = "0.1.0"
description = "Simple CrewAI recruiting demo."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "crewai>=1.15,<2.0",
  "pydantic>=2.7,<3.0",
  "python-dotenv>=1.0,<2.0",
]

[project.scripts]
recruit = "ai_recruiting_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_recruiting_agent"]
